[package]
name = "jend-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
jend-admission = { path = "../../crates/jend-admission" }
jend-auth = { path = "../../crates/jend-auth" }
jend-jreq = { path = "../../crates/jend-jreq" }
jend-release = { path = "../../crates/jend-release" }
jend-model-store = { path = "../../crates/jend-model-store" }
libc = "=0.2.190"
jend-sync = { path = "../../crates/jend-sync" }
lz4_flex = { version = "=0.13.1", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = "1.9"
getrandom = { version = "0.4.3", features = ["std"] }
