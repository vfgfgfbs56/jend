[package]
name = "jend-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jend-sync = { path = "../jend-sync" }
chacha20poly1305 = { version = "0.11.0", features = ["alloc"] }
getrandom = { version = "0.4.3", features = ["std"] }
hkdf = "0.13.0"
opaque-ke = { version = "4.0.1", features = ["argon2", "ristretto255"] }
rand = "0.8.5"
sha2 = "0.11.0"
sha2_10 = { package = "sha2", version = "0.10.9" }
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.0", features = ["derive"] }
