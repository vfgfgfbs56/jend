name: Jend Rust security and workspace checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Enforce source policy and project integrity
        run: |
          python3 scripts/static-preflight.py
          python3 scripts/dependency-policy.py
          python3 scripts/verify-manifest.py
      - name: Require current Jend root project context in each substantive PR
        env:
          JEND_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          JEND_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-project-context-update.py
      - name: Existing rustfmt baseline drift (non-blocking until normalized)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Generate dependency lockfile
        run: cargo generate-lockfile
      - name: Locked workspace compilation
        run: cargo check --workspace --all-targets --locked
      - name: Locked workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Exercise independent signed Xet WeightPage admission fixture
        run: bash scripts/dev-xet-signed-page-admission-smoke.sh
      - name: Verify universal runtime planning rejects unsupported or low-memory choices
        run: bash scripts/dev-runtime-feasibility-smoke.sh
      - name: Verify pinned native GGUF worker protocol without model or llama dependency
        run: bash scripts/dev-native-gguf-worker-protocol-smoke.sh
      - name: Verify Rust-to-C++ native supervisor and strict one-shot framing
        run: bash scripts/dev-native-gguf-rust-supervisor-smoke.sh
      - name: Prove independently release-signed GGUF whole-file intake and reject corrupt bytes
        run: bash scripts/dev-signed-gguf-intake-smoke.sh
      - name: Verify signed GGUF snapshot and pinned descriptor across path substitution
        run: bash scripts/dev-verified-gguf-snapshot-smoke.sh
      - name: Verify independent native worker binary SHA256 preflight rejects tampering
        run: bash scripts/dev-native-worker-integrity-smoke.sh
